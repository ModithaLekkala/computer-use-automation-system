[project]
name = "interface-ai-computer-use-automation"
version = "0.1.0"
description = "LLM discovery to structured capability to deterministic replay"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "playwright>=1.47",
  "pydantic>=2.9",
  "python-dotenv>=1.0",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "openai>=1.50",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
